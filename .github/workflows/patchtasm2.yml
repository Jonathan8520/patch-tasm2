name: Patch TASM2 IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct IPA URL (archive.org)"
        required: true
        default: "https://archive.org/download/the_amazing_spider_man_2_v1_3_1_ipa_1.3.1_ios_8.0/The_Amazing_Spider_Man_2_v1_3_1_ipa_1.3.1_ios_8.0.ipa"
      patch_flags:
        description: >-
          Extra flags for patch_tasm2.py, e.g. --no-persist-chapter or
          --fail-network. An unknown flag fails the build instead of being
          ignored. --no-force-prologue-skip was renamed --no-tutorial-guards;
          the old name still works. Leave empty for the nine shipped edits.
        required: false
        default: ""
      release_tag:
        description: "Tag of the Release that will hold the patched IPA"
        required: false
        default: "v1.0"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Available disk space
        run: df -h /

      - name: Download the IPA
        run: |
          echo "Downloading from ${{ github.event.inputs.ipa_url }}"
          curl -L --fail --retry 3 --retry-delay 5 \
               -o original.ipa \
               "${{ github.event.inputs.ipa_url }}"
          ls -la original.ipa
          echo "sha1: $(sha1sum original.ipa | cut -d' ' -f1)"

      - name: Extract
        run: |
          mkdir -p work
          unzip -q original.ipa -d work
          echo "--- layout ---"
          ls work/
          ls work/Payload/
          APP=$(ls -d work/Payload/*.app | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          echo "bundle: $APP"
          ls -la "$APP/AmazingSpiderMan2"

      - name: Patch the binary
        run: |
          python3 patch_tasm2.py ${{ github.event.inputs.patch_flags }} \
            "$APP/AmazingSpiderMan2" \
            AmazingSpiderMan2_patched
          # replace while keeping the executable bit
          cp AmazingSpiderMan2_patched "$APP/AmazingSpiderMan2"
          chmod 755 "$APP/AmazingSpiderMan2"
          ls -la "$APP/AmazingSpiderMan2"

      - name: Strip the signature
        run: |
          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"
          echo "signature stripped"
          ls "$APP/" | head -20

      - name: Rebuild the IPA
        run: |
          cd work
          # zip the Payload folder itself, not its contents
          zip -qr ../SpiderMan2_patched.ipa Payload
          cd ..
          ls -la SpiderMan2_patched.ipa
          echo "--- archive root check ---"
          unzip -l SpiderMan2_patched.ipa | head -8

      - name: Verify the result
        run: |
          set -euo pipefail
          mkdir -p verif
          unzip -qo SpiderMan2_patched.ipa -d verif
          # A glob, not `ls | head -1`: under `pipefail` a SIGPIPE from ls
          # when head closes the pipe early would fail the step for no reason.
          APP=(verif/Payload/*.app)
          if [ ${#APP[@]} -ne 1 ]; then
            echo "FAIL: expected exactly one .app in Payload, found ${#APP[@]}"
            exit 1
          fi
          BIN="${APP[0]}/AmazingSpiderMan2"

          SIZE=$(stat -c%s "$BIN")
          echo "size: $SIZE (expected 33375152)"
          if [ "$SIZE" != "33375152" ]; then
            echo "FAIL: the shipped binary changed size"
            exit 1
          fi

          echo "--- injected .invalid hosts ---"
          strings "$BIN" | grep -c 'invalid' || true

          # Every edit, plus "no live Gameloft host left", checked on the
          # binary that actually ships -- after the rezip, not before.
          #
          # The host check lives in patch_tasm2.py rather than in a grep here,
          # because a grep for gameloft.com has to know that the obfuscated
          # `jngbmfbds_gameloft.com` and the `<your_gl_account>@gameloft.com`
          # placeholder legitimately survive. The grep that used to sit here
          # could not fail the build in any case: it ended in `|| echo "none :
          # OK"`, so the step exited 0 whatever it printed.
          echo "--- every edit, checked on the binary that ships ---"
          python3 patch_tasm2.py --verify ${{ github.event.inputs.patch_flags }} "$BIN"

      - name: Publish the IPA as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "TASM2 patched (${{ github.event.inputs.release_tag }})"
          body: |
            **The Amazing Spider-Man 2 (1.3.1)** — patched to launch, play and
            **save** entirely offline, after Gameloft shut down its servers.

            Nine instructions in the arm64 slice, all derived from the
            disassembly and re-verified on the binary in this IPA. No size
            change, no injected code.

            Extra patch flags for this build: `${{ github.event.inputs.patch_flags }}`
            (empty means the nine shipped edits and nothing else).

            Confirmed on device: a continuous playthrough through the
            prologue, all of chapter 1 and into chapter 2, with the app
            force-quit several times. Settings, trophies, exploration,
            skills, position, tutorial state and the story cursor all
            survive.

            - Signature stripped — re-sign with LiveContainer / SideStore /
              Sideloadly
            - **Install fresh rather than over the top**: LiveContainer
              converts the executable at install time, and replacing a binary
              inside an installed `.app` produces
              `cannot dlopen a main executable`
            - Built by the `Patch TASM2 IPA` workflow (run #${{ github.run_number }})

            See the README for what works, what does not, and how each edit
            was arrived at.
          files: SpiderMan2_patched.ipa
          fail_on_unmatched_files: true

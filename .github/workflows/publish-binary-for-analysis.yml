name: Publish binary for analysis

# Pulls the app executable out of the IPA and publishes it (gzipped, ~15 MB)
# as a Release asset, so the binary can be disassembled without re-downloading
# the 769 MB archive every time.

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/publish-binary-for-analysis.yml"]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct IPA URL (archive.org)"
        required: false
        default: "https://archive.org/download/the_amazing_spider_man_2_v1_3_1_ipa_1.3.1_ios_8.0/The_Amazing_Spider_Man_2_v1_3_1_ipa_1.3.1_ios_8.0.ipa"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Download the IPA
        run: |
          URL="${{ github.event.inputs.ipa_url }}"
          if [ -z "$URL" ]; then
            URL="https://archive.org/download/the_amazing_spider_man_2_v1_3_1_ipa_1.3.1_ios_8.0/The_Amazing_Spider_Man_2_v1_3_1_ipa_1.3.1_ios_8.0.ipa"
          fi
          curl -L --fail --retry 3 --retry-delay 5 -o original.ipa "$URL"
          ls -la original.ipa

      - name: Extract the executable only
        run: |
          unzip -j original.ipa 'Payload/*.app/AmazingSpiderMan2' -d out
          ls -la out/
          echo "sha1: $(sha1sum out/AmazingSpiderMan2 | cut -d' ' -f1)"
          echo "size: $(stat -c%s out/AmazingSpiderMan2)"
          unzip -l original.ipa > bundle-listing.txt
          wc -l bundle-listing.txt

      - name: Compress
        run: |
          gzip -9 -c out/AmazingSpiderMan2 > AmazingSpiderMan2.gz
          gzip -9 -c bundle-listing.txt > bundle-listing.txt.gz
          ls -la AmazingSpiderMan2.gz bundle-listing.txt.gz
          sha1sum AmazingSpiderMan2.gz

      - name: Publish as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: analysis-binary
          name: "TASM2 1.3.1 executable (for analysis)"
          body: |
            Unpatched `AmazingSpiderMan2` executable extracted from the 1.3.1
            IPA (FAT armv7 + arm64, 33,375,152 bytes,
            sha1 `b3d322a788bbeeb1a006ba0da23a28300a5b7105`), gzipped.

            Published so the binary can be disassembled without re-downloading
            the 769 MB archive. Not a redistribution of the game: the
            executable alone is inert without the bundle's assets.
          files: |
            AmazingSpiderMan2.gz
            bundle-listing.txt.gz
          fail_on_unmatched_files: true
